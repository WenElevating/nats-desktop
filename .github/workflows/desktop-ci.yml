name: desktop-ci

on:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop-ci.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop-ci.yml"]

permissions:
  contents: read

jobs:
  go:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # main.go's //go:embed all:frontend/dist fails to compile when dist/
      # (gitignored, built by the frontend job) is absent — vet/test only need
      # the pattern satisfied, so drop in a placeholder page. The build job
      # embeds the real bundle.
      - run: |
          New-Item -ItemType Directory -Force frontend/dist | Out-Null
          Set-Content frontend/dist/index.html "<!doctype html><title>ci placeholder</title>"
      - run: go vet ./...
      # -race needs cgo (preinstalled MinGW on windows runners); kept in CI
      # because the local toolchain cannot run it. -cover prints per-package
      # coverage; the buckets ≥80% judgment (§20.1) is recorded in the test
      # report — CI only surfaces the numbers, the gate is enforced there.
      - run: go test ./... -race -count=1 -cover

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src --max-warnings 0
      - run: npx vitest run --coverage # includes the i18n completeness gate (spec AC-021, automated half); --coverage prints the components baseline (M4 Task 9)

  build:
    needs: [go, frontend]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.20
      - run: wails3 build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: nats-desktop-windows
          path: desktop/bin/

  # Performance gates (Task 11). The Go floor test runs in a 2-core container
  # to simulate the spec's 低配档 (spec §20 容器 CPU 限额模拟低配): the 50,000
  # msg/s pipeline floor must hold on weak hardware. The frontend perf test is
  # jsdom-logic-only (no NATS server needed; frame-rate validation is Task 13's
  # live measurement). -buildvcs=false: the runner-owned checkout is mounted
  # into a root-owned container, which git refuses without safe.directory.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Go pipeline throughput floor (2-core container)
        run: docker run --rm --cpus 2 -v ${{ github.workspace }}:/w -w /w/desktop golang:1.26 go test ./internal/messaging/ -run TestPipelineThroughputFloor -count=1 -buildvcs=false -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json
      - run: npm ci
        working-directory: desktop/frontend
      - run: npx vitest run tests/messages-perf.test.ts
        working-directory: desktop/frontend
      # Task 14: execute the vitest benchmark files (M2 sessions + M3 streams).
      # The plain `vitest run` suite excludes *.bench.ts by include-pattern.
      - run: npx vitest bench --run tests/bench/
        working-directory: desktop/frontend
